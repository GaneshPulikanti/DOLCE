name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies & Build Flutter Web
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --no-tree-shake-icons -O2
          cp vercel.json build/web/vercel.json

      - name: Deploy build/web to Vercel
        run: |
          npx vercel deploy ./build/web --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
