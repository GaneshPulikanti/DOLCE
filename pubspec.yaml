name: musicplayer
description: "A premium hybrid music/video streaming app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Networking
  dio: ^5.7.0
  crypto: ^3.0.3

  # Audio
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3



  # YouTube
  youtube_explode_dart: ^3.1.0
  dart_ytmusic_api: ^1.3.6

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  palette_generator: ^0.3.3+4

  # Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  hive_flutter: ^1.1.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  collection: ^1.19.1
  rxdart: ^0.28.0
  http: ^1.6.0
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/dolce_icon.png"
  adaptive_icon_background: "assets/icon/dolce_icon.png"
  adaptive_icon_foreground: "assets/icon/transparent.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

